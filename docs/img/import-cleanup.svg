<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Cleanup keeps the title, byline, date, subtitle, text and captioned pictures, and drops menus, ads, comments, related links and placeholder images">
<rect width="800" height="440" fill="#F3EAD7"/>
<text x="40" y="50" font-size="30" font-weight="800" fill="#2E2119">What cleanup keeps and drops</text>
<rect x="40" y="80" width="340" height="320" rx="14" fill="#FBF6EA" stroke="#2F5A43" stroke-width="6"/>
<rect x="40" y="80" width="340" height="56" rx="14" fill="#2F5A43"/>
<text x="210" y="118" font-size="26" font-weight="800" fill="#FBF6EA" text-anchor="middle">Keeps</text>
<g font-size="22" font-weight="700" fill="#2E2119">
<text x="68" y="180">Title and byline</text>
<text x="68" y="219">Published date</text>
<text x="68" y="258">Subtitle, first</text>
<text x="68" y="297">Article text</text>
<text x="68" y="336">Pictures and captions</text>
<text x="68" y="375">Headings</text>
</g>
<rect x="420" y="80" width="340" height="320" rx="14" fill="#FBF6EA" stroke="#8E2F2A" stroke-width="6"/>
<rect x="420" y="80" width="340" height="56" rx="14" fill="#8E2F2A"/>
<text x="590" y="118" font-size="26" font-weight="800" fill="#FBF6EA" text-anchor="middle">Drops</text>
<g font-size="22" font-weight="700" fill="#2E2119">
<text x="448" y="180">Menus and footers</text>
<text x="448" y="219">Ads and sidebars</text>
<text x="448" y="258">Comments</text>
<text x="448" y="297">Related links</text>
<text x="448" y="336">Blank placeholder pictures</text>
<text x="448" y="375">Photo credits on pictures</text>
</g>
</svg>
