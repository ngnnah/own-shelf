<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Seven steps from a pasted link to a book on the shelf: the helper fetches the page, the app finds and cleans the article, you review it, then add it">
<rect width="800" height="460" fill="#F3EAD7"/>
<text x="40" y="50" font-size="30" font-weight="800" fill="#2E2119">How a link becomes a book</text>
<g stroke="#2E2119" stroke-width="4">
<rect x="40" y="90" width="150" height="90" rx="12" fill="#FBF6EA"/>
<rect x="230" y="90" width="150" height="90" rx="12" fill="#8E2F2A"/>
<rect x="420" y="90" width="150" height="90" rx="12" fill="#8E2F2A"/>
<rect x="610" y="90" width="150" height="90" rx="12" fill="#2F5A43"/>
<rect x="40" y="290" width="150" height="90" rx="12" fill="#2F5A43"/>
<rect x="230" y="290" width="150" height="90" rx="12" fill="#2F5A43"/>
<rect x="420" y="290" width="150" height="90" rx="12" fill="#5C3B24"/>
</g>
<g font-size="24" font-weight="800" text-anchor="middle">
<text x="115" y="143" fill="#2E2119">1 Link</text>
<text x="305" y="143" fill="#FBF6EA">2 Helper</text>
<text x="495" y="143" fill="#FBF6EA">3 Page</text>
<text x="685" y="143" fill="#FBF6EA">4 Article</text>
<text x="115" y="343" fill="#FBF6EA">5 Clean</text>
<text x="305" y="343" fill="#FBF6EA">6 Review</text>
<text x="495" y="343" fill="#FBF6EA">7 Shelf</text>
</g>
<g font-size="17" fill="#2E2119" text-anchor="middle">
<text x="115" y="208">you paste it</text>
<text x="305" y="208">gets your token</text>
<text x="495" y="208">fetched for you</text>
<text x="685" y="208">Readability</text>
<text x="115" y="408">subtitle, pictures, date</text>
<text x="305" y="408">title, author, date</text>
<text x="495" y="408">added to your books</text>
</g>
