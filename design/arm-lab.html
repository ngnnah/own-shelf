<!DOCTYPE html>
<!--
  own-shelf arm lab: the source drawing of the app icon, a wooden bookshelf shaped like a flexed arm.
  The icon's settings are in icon.json; `npm run icons` (export-icons.mjs) redraws every file in icons/ from both.
  To edit: open this file in Chrome (straight from disk works). It opens on its own preset, so load the icon first
  by running this in the console, with icon.json's contents in place of {...}:
    localStorage.setItem('own-shelf-arm-lab:cfg', JSON.stringify({...})); location.reload()
  Tune, then "Copy JSON" and paste its "cfg" into icon.json. The exporter sets "fit" (mark radius) per file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>own-shelf arm lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Libre+Caslon+Text:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f2ee; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e2e0da;
  --soft: #f7f6f3; --accent: #1f3a2e; --accent-ink: #ffffff; --focus: #3b82f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141514; --panel: #1c1d1c; --ink: #ececea; --muted: #9b9b97; --line: #2e2f2d;
          --soft: #222322; --accent: #8fd1ad; --accent-ink: #10231a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
.app { display: grid; grid-template-columns: 330px 1fr; height: 100vh; }
aside { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 16px 120px; }
main { overflow-y: auto; padding: 22px 28px 80px; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: -0.01em; }
h2 { font-size: 13px; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 6px; }
button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.row-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.sec { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
.sec-title { font-weight: 650; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
.ctl { display: grid; grid-template-columns: 112px 1fr 44px; align-items: center; gap: 8px; margin: 5px 0; }
.ctl label { font-size: 12px; }
.ctl .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; text-align: right; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl select, .ctl input[type=text] { grid-column: 2 / 4; font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); width: 100%; }
.ctl.check input { justify-self: start; accent-color: var(--accent); }
.ctl .colorwrap { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; }
.ctl input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; }
.ctl .hex { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
.swatches { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; margin-top: -2px; }
.swatches span { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); cursor: pointer; }
.ctl.hidden { display: none; }
textarea { width: 100%; min-height: 54px; font: inherit; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); resize: vertical; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 5px 10px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.readout { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.readout b { color: var(--ink); font-weight: 600; }
.warn { color: #c2410c; }
@media (prefers-color-scheme: dark) { .warn { color: #fb923c; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
.card .stage { height: 140px; display: grid; place-items: center; }
.card .cap { padding: 6px 9px 8px; font-size: 12px; }
.card .cap small { color: var(--muted); display: block; }
.pins { display: grid; gap: 8px; }
.pin { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.pin .name { font-weight: 600; }
.pin .name small { display: block; color: var(--muted); font-weight: 400; }
.pin .strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.empty { color: var(--muted); font-style: italic; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.conn { font-size: 11px; color: var(--muted); }

/* ═══ the arm lab: context scenes ═══ */
.ctx { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 1150px) { .ctx { grid-template-columns: 1fr; } }
.phone { width: 300px; height: 300px; border-radius: 38px; padding: 16px 14px; background: linear-gradient(170deg, #c9b38a, #7d6a52 60%, #3e3226); box-shadow: inset 0 0 0 7px #111, 0 10px 30px rgba(0,0,0,.25); color: #fff; font: 12px -apple-system, system-ui, sans-serif; }
.phone .status { display: flex; justify-content: space-between; padding: 4px 16px 16px; font-weight: 600; font-size: 13px; }
.apps { display: grid; grid-template-columns: repeat(4, 60px); gap: 16px 7px; justify-content: center; }
.hsapp { display: grid; justify-items: center; gap: 5px; }
.hsapp .ic { width: 60px; height: 60px; border-radius: 13.4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.28); }
.hsapp span { font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: nowrap; }
.right { display: grid; gap: 12px; min-width: 0; }
.browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #e8e6e1; }
.tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
.tab { display: flex; align-items: center; gap: 7px; padding: 7px 12px; background: #fff; border-radius: 8px 8px 0 0; font: 12px -apple-system, system-ui, sans-serif; color: #222; }
.tab.dim { background: transparent; color: #666; }
.addr { background: #fff; padding: 7px 12px; font: 12px -apple-system, system-ui, sans-serif; color: #555; border-top: 1px solid #ddd; }
.appbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #F3EAD7; color: #2E2119; }
.appbar .wm { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.appbar .btns { margin-left: auto; font: 600 12px -apple-system, system-ui, sans-serif; color: #6b5a48; }
.signin { display: grid; justify-items: center; gap: 10px; padding: 22px; border-radius: 16px; background: #F8F1E2; border: 1px solid #e3d5b8; color: #2E2119; text-align: center; }
.signin h3 { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.1; }
.signin .mock { padding: 9px 18px; border-radius: 999px; background: #2F4A3A; color: #F3EAD7; font: 600 13px -apple-system, system-ui, sans-serif; }
.sizes { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 14px; border-radius: 10px; background: #e9e3d6; }
.sizes figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: #6b5a48; }
.sizes .ic { overflow: hidden; border-radius: 22.5%; }
</style>
</head>
<body>
<div class="app">
<aside>
  <h1 id="labTitle"></h1>
  <p class="sub" style="margin-bottom:6px">Start from a direction, then tune. Everything updates live.</p>
  <div class="presets" id="presets"></div>
  <div class="row-buttons"><button id="surprise">Surprise me</button><button id="reset">Reset to preset</button></div>
  <div id="controls"></div>
</aside>
<main>
  <h1 id="mainTitle"></h1>
  <p class="sub" id="blurb"></p>
  <div class="toolbar"><div class="seg" id="stateSeg"></div></div>

  <h2>Where it lives, real size</h2>
  <div id="context"></div>
  <p class="readout" id="readout"></p>

  <h2>Every state</h2>
  <div class="grid" id="grid"></div>

  <h2>Pinned variants</h2>
  <div class="toolbar"><button id="pinBtn">Pin this variant</button><span class="conn" id="conn"></span></div>
  <div class="pins" id="pins"></div>

  <h2>Send to Claude</h2>
  <textarea id="note" placeholder="What you like, what's off, which pin wins…"></textarea>
  <div class="toolbar"><button class="primary" id="sendBtn">Send current + pins to Claude</button><button id="copyBtn">Copy JSON</button></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
// ═════════════════════════════════════════════════════════════════════════════
// EDIT ME: the subject. Everything between here and "ENGINE" is per lab.
// The sample subject is an app mark (shape + letter), to show every hook.
// ═════════════════════════════════════════════════════════════════════════════

/* ---------- shelf trinkets ----------
   Small antique objects that stand on the shelves among the books.
   TRINKETS[kind] = { aspect, draw(x, yb, h, o) }: the object's bottom sits on y = yb, its left edge
   at x, its height is h and its width h * aspect. Each one is drawn once in its own local units and
   tkMake maps that drawing's box onto the shelf slot with a single transform.
   o = { mono, small, ink, paper, wood, woodHi, gold, pal }:
     mono  → one ink (o.ink) with paper (o.paper) for highlights and cut-outs
     small → one bold silhouette of at most 2 shapes, no fine lines (icons at 48 px and below)
   Light parts carry a thin ink edge so they hold on a cream shelf back; dark parts carry a light
   rim so they hold on a near-black one. Uses the page's f(n); every other name here starts with tk/TK. */

const TK_COL = {
  brass: '#C8A24A', brassLo: '#9A7630', terra: '#B5643C', terraHi: '#CB7C52', terraLo: '#87452A',
  plaster: '#E8DFCF', plasterLo: '#CDC1AA', glass: '#BFD3D0', sand: '#CFA251',
  leaf: '#4F7A4A', leafHi: '#6E9A5C', flame: '#F2B544', flameCore: '#E07A2E', flameEdge: '#C9772B',
  sea: '#4E7C78', land: '#BFAE72', wax: '#F1E6CE', quill: '#F3ECDC', quillShaft: '#B9A47E',
  bottle: '#2E4762', bottleHi: '#9DBAD0', shade: '#246B47', shadeHi: '#79BE93', glow: '#F7DC8E',
  apple: '#B23A2C', appleHi: '#E08A78', stem: '#5A3A24', dial: '#F6EEDC',
};

// Resolve the caller's options, tolerating missing fields (o.gold is a colour here, never a flag).
// u = local drawing units per SVG user unit, so stroke widths stay in user units whatever h is.
function tkOpts(o, u) {
  o = o || {};
  const s = (v, d) => (typeof v === 'string' && v ? v : d);
  const c = {
    mono: !!o.mono, small: !!o.small, u,
    ink: s(o.ink, '#2E2119'), paper: s(o.paper, '#F1E7D2'),
    wood: s(o.wood, '#8B5E3C'), woodHi: s(o.woodHi, '#A97A50'), gold: s(o.gold, TK_COL.brass),
    pal: Array.isArray(o.pal) && o.pal.length ? o.pal : ['#7A2E2A', '#2F4A3A', '#22324A', '#B8892E', '#4E7C78'],
  };
  c.m = col => (c.mono ? c.ink : col);             // colour in normal mode, ink in mono
  c.hi = col => (c.mono ? c.paper : col);          // highlight: its colour, or paper in mono
  c.sw = (col, w, op) => ` stroke="${col}" stroke-width="${f(w * u)}" stroke-linejoin="round" stroke-linecap="round"${op ? ` stroke-opacity="${op}"` : ''}`;
  c.edge = w => c.sw(c.ink, w || (c.small ? 1.5 : 1.15));  // thin ink keyline for light and mid parts
  return c;
}
// box = [x, y, w, h] of the drawing in its local units (bottom edge = where it stands).
function tkMake(box, paint) {
  const [bx, by, bw, bh] = box;
  return {
    aspect: bw / bh,
    draw(x, yb, h, o) {
      const s = h / bh;
      return `<g transform="translate(${f(x - bx * s)} ${f(yb - h - by * s)}) scale(${s.toFixed(5)})">${paint(tkOpts(o, 1 / s))}</g>`;
    },
  };
}
function tkPath(d, fill, more) { return `<path d="${d}" fill="${fill}"${more || ''}/>`; }
function tkRectD(x, y, w, h, r) {
  r = Math.min(r || 0, w / 2, h / 2);
  return `M${f(x + r)} ${f(y)}H${f(x + w - r)}Q${f(x + w)} ${f(y)} ${f(x + w)} ${f(y + r)}V${f(y + h - r)}Q${f(x + w)} ${f(y + h)} ${f(x + w - r)} ${f(y + h)}H${f(x + r)}Q${f(x)} ${f(y + h)} ${f(x)} ${f(y + h - r)}V${f(y + r)}Q${f(x)} ${f(y)} ${f(x + r)} ${f(y)}Z`;
}
function tkCircD(cx, cy, r) {
  return `M${f(cx - r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx + r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx - r)} ${f(cy)}Z`;
}
// Closed band along a circle of radius r, width w, from angle a0 clockwise to a1 (degrees, SVG frame).
function tkBandD(cx, cy, r, w, a0, a1) {
  const p = (rr, a) => [cx + rr * Math.cos(a * Math.PI / 180), cy + rr * Math.sin(a * Math.PI / 180)];
  const ro = r + w / 2, ri = r - w / 2, big = a1 - a0 > 180 ? 1 : 0;
  const A = p(ro, a0), B = p(ro, a1), C = p(ri, a1), D = p(ri, a0);
  return `M${f(A[0])} ${f(A[1])}A${f(ro)} ${f(ro)} 0 ${big} 1 ${f(B[0])} ${f(B[1])}L${f(C[0])} ${f(C[1])}A${f(ri)} ${f(ri)} 0 ${big} 0 ${f(D[0])} ${f(D[1])}Z`;
}
// Pointed leaf (or feather vane) from (bx, by) towards angle ang (degrees from straight up, clockwise),
// about wa wide on its left and wb on its right, widest a little below the middle.
function tkLeafD(bx, by, len, wa, ang, wb) {
  const a = ang * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a), nx = -dy, ny = dx;
  const tx = bx + dx * len, ty = by + dy * len, mx = bx + dx * len * 0.45, my = by + dy * len * 0.45;
  wb = wb === undefined ? wa : wb;
  return `M${f(bx)} ${f(by)}Q${f(mx - nx * wa * 2)} ${f(my - ny * wa * 2)} ${f(tx)} ${f(ty)}Q${f(mx + nx * wb * 2)} ${f(my + ny * wb * 2)} ${f(bx)} ${f(by)}Z`;
}

const TRINKETS = {
  // Desk globe: sea-green sphere with parchment land, a brass half-meridian, brass stem, turned wooden foot.
  globe: tkMake([5, 2.5, 59.5, 97.5], c => {
    const sm = c.small, band = tkBandD(30, 37, 31, sm ? 7 : 5, -112, 90), knob = tkCircD(18.4, 8.3, sm ? 4.2 : 3.4);
    const stem = tkRectD(27, 66, 6, 24, 0), foot = 'M11 100C11 92 18 88 30 88C42 88 49 92 49 100Z', sphere = tkCircD(30, 37, 25);
    if (sm) return tkPath(band + knob + stem + foot, c.m(c.gold), c.mono ? '' : c.edge()) + tkPath(sphere, c.m(TK_COL.sea), c.mono ? '' : c.edge());
    // an Old-World mass right of centre, a sliver of the Americas on the left limb
    const land = 'M31 16C36 13 44 14 49 19C51 22 49 25 45 25C42 26 42 29 45 31C49 33 51 37 49 42C47 47 43 50 41 56C39 57 37 54 37 50' +
      'C36 46 32 44 32 40C32 36 35 34 33 31C31 29 27 29 27 25C27 21 28 18 31 16Z' +
      'M8 28C10 25 14 24 16 26C18 28 15 31 16 34C17 38 20 41 19 46C18 50 15 51 13 49C10 46 8 42 7 37C6.5 34 7 30 8 28Z';
    return tkPath(foot, c.m(c.wood), c.mono ? '' : c.sw(c.woodHi, 1)) +
      tkPath(stem, c.m(c.gold), c.mono ? '' : c.edge(1)) +
      tkPath(sphere, c.m(TK_COL.sea), c.mono ? '' : c.edge()) +
      tkPath(land, c.hi(TK_COL.land)) +
      tkPath(band + knob, c.m(c.gold), c.mono ? '' : c.edge(1));
  }),

  // Hourglass: two wooden plates on turned posts, a glass bow-tie, sand above and below.
  hourglass: tkMake([0, 0, 60, 100], c => {
    const plates = tkRectD(0, 0, 60, 10, 2.5) + tkRectD(0, 90, 60, 10, 2.5);
    const posts = tkRectD(4, 9, 7, 82, 0) + tkRectD(49, 9, 7, 82, 0);
    const glass = 'M14.5 10H45.5C45.5 31 33 40 33 50C33 60 45.5 69 45.5 90H14.5C14.5 69 27 60 27 50C27 40 14.5 31 14.5 10Z';
    if (c.small) return tkPath(glass, c.mono ? c.paper : TK_COL.sand, c.edge(c.mono ? 2 : 1.5)) +
      tkPath(plates + posts, c.m(c.wood), c.mono ? '' : c.sw(c.woodHi, 1.2));
    return tkPath(glass, c.mono ? c.paper : TK_COL.glass, (c.mono ? '' : ' fill-opacity=".7"') + c.edge(c.mono ? 1.3 : 0.9)) +
      tkPath('M18.5 29H41.5C38 39 33.2 43 33 47.5L30 50.5L27 47.5C26.8 43 22 39 18.5 29Z', c.m(TK_COL.sand)) +
      tkPath('M15.5 90C15.5 78 22 70 30 67C38 70 44.5 78 44.5 90Z', c.m(TK_COL.sand)) +
      tkPath(tkRectD(29.3, 50, 1.4, 19, 0), c.m(TK_COL.sand)) +
      tkPath(posts + tkCircD(7.5, 50, 5) + tkCircD(52.5, 50, 5), c.m(c.woodHi), c.mono ? '' : c.edge(0.8)) +
      tkPath(plates, c.m(c.wood), c.mono ? '' : c.sw(c.woodHi, 1));
  }),

  // Chamberstick: brass dish and socket, an ivory candle, a small flame with a warm glow.
  candle: tkMake([2, 2, 44, 98], c => {
    const dish = tkRectD(2, 90, 44, 10, 4), socket = 'M15 91L17 81H31L33 91Z', lip = tkRectD(13, 77, 22, 4.5, 1.5);
    const candle = tkRectD(17.5, 31, 13, 47, 1.2);
    const flame = 'M24 3C28 10 30.5 15 30.5 19.5C30.5 23.5 27.6 26.5 24 26.5C20.4 26.5 17.5 23.5 17.5 19.5C17.5 15 20 10 24 3Z';
    if (c.small) return tkPath(dish + socket + lip + candle, c.m(TK_COL.wax), c.mono ? '' : c.edge()) +
      tkPath(flame, c.m(TK_COL.flame), c.mono ? '' : c.sw(TK_COL.flameEdge, 1.2));
    return (c.mono ? '' : tkPath(tkCircD(24, 18, 16), TK_COL.flame, ' fill-opacity=".1"') + tkPath(tkCircD(24, 19, 10.5), TK_COL.flame, ' fill-opacity=".16"')) +
      tkPath(candle, c.m(TK_COL.wax), c.mono ? '' : c.edge()) +
      tkPath(tkRectD(20, 34, 2.6, 41, 1.3), c.hi('#FFFFFF'), c.mono ? '' : ' fill-opacity=".6"') +
      tkPath(tkRectD(23.4, 24, 1.2, 8, 0), c.ink) +
      tkPath(dish + socket + lip, c.m(c.gold), c.mono ? '' : c.edge(1)) +
      tkPath(flame, c.m(TK_COL.flame), c.mono ? '' : c.sw(TK_COL.flameEdge, 0.8)) +
      tkPath('M24 13C25.8 16.5 27 18.5 27 20.8C27 22.8 25.7 24.2 24 24.2C22.3 24.2 21 22.8 21 20.8C21 18.5 22.2 16.5 24 13Z', c.hi(TK_COL.flameCore));
  }),

  // Potted aspidistra (the Victorian parlour plant): a fan of broad pointed leaves in a terracotta pot.
  plant: tkMake([9.2, 4, 52.9, 96], c => {
    const fan = [[-52, 34, 7], [-24, 46, 8], [0, 56, 8.5], [24, 46, 8], [50, 34, 7]];
    const leaves = (k, idx) => idx.map(i => tkLeafD(36, 60, fan[i][1], fan[i][2] * k, fan[i][0])).join('');
    const pot = 'M20 64H52L48 100H24Z', rim = tkRectD(16, 58, 40, 9, 2);
    if (c.small) return tkPath(leaves(1.25, [0, 1, 2, 3, 4]), c.m(TK_COL.leaf), c.mono ? '' : c.edge(1.2)) +
      tkPath(pot + rim, c.m(TK_COL.terra), c.mono ? c.sw(c.paper, 2.2) : c.edge());
    const vein = c.mono ? c.sw(c.paper, 1) : c.edge(0.9);
    return tkPath(leaves(1, [0, 4, 2]), c.m(TK_COL.leaf), vein) +

/* ---------- geometry helpers (design space 0..512, y down) ---------- */
function rrect(x0, y0, x1, y1, r) {
  const m = Math.min((x1 - x0) / 2, (y1 - y0) / 2), R = k => Math.max(0, Math.min(m, r[k] || 0)), out = [];
  const arc = (cx, cy, rad, a0) => { for (let i = 0; i <= 6; i++) { const a = (a0 + 90 * i / 6) * Math.PI / 180; out.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]); } };
  arc(x0 + R('tl'), y0 + R('tl'), R('tl'), 180); arc(x1 - R('tr'), y0 + R('tr'), R('tr'), 270);
  arc(x1 - R('br'), y1 - R('br'), R('br'), 0); arc(x0 + R('bl'), y1 - R('bl'), R('bl'), 90);

  if (c.ribbon && !small) { const [x, y] = G.ribbon, w = 4.2, L = 34; g += `<path d="M${f(x)},${f(y)} H${f(x + w)} V${f(y + L)} L${f(x + w / 2)},${f(y + L - w * 0.9)} L${f(x)},${f(y + L)} Z" fill="${mono ? INK : '#8E2F2A'}"/>`; }
  let body = tile + `<g transform="translate(-50 -50) scale(0.1953125)"><g transform="${G.tf}">${g}</g></g>`;
  if (bgName === 'circle') { defs += `<clipPath id="${uid}cc"><circle r="50"/></clipPath>`; body = `<g clip-path="url(#${uid}cc)">${body}</g>`; }
  return `<defs>${defs}</defs>${body}`;
}


/* ---------- where it lives ---------- */
function contextScene(c, state) {
  const bg = state.split('-')[0], sm = c.simplify ? bg + '-s' : bg, ff = `font-family:'${c.font}', Georgia, serif`;
  const app = (bgc, name) => `<div class="hsapp"><div class="ic" style="background:${bgc}"></div><span>${name}</span></div>`;
  return {
    html: `<div class="ctx">
      <div class="phone"><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="apps">
        ${app('linear-gradient(#ffe27a,#f7b733)', 'Notes')}${app('linear-gradient(#6fd0ff,#1e7cf2)', 'Safari')}
        <div class="hsapp"><div class="ic slotHome"></div><span>own-shelf</span></div>${app('linear-gradient(#ffb15c,#ef6b2c)', 'Books')}
        ${app('linear-gradient(#9be15d,#2fb36b)', 'Messages')}${app('linear-gradient(#e7e7ea,#c9c9cf)', 'Settings')}${app('linear-gradient(#ff6a88,#d6334f)', 'Music')}${app('linear-gradient(#5a5a62,#2b2b30)', 'Camera')}
      </div></div>
      <div class="right">
        <div class="browser"><div class="tabs"><div class="tab"><span class="slotFav"></span>own-shelf</div><div class="tab dim">MIT Technology Review</div></div><div class="addr">ngnnah.github.io/own-shelf</div></div>
        <div class="appbar"><span class="slotBrand"></span><b class="wm" style="${ff}">own-shelf</b><span class="btns">Notebook · Add to shelf</span></div>
        <div class="signin"><div class="slotHero"></div><h3 style="${ff}">Your shelf, on every device.</h3><div class="mock">Sign in with Google</div></div>
        <div class="sizes">${[180, 96, 64, 48, 32, 16].map(n => `<figure><div class="ic sz${n}" style="width:${n}px;height:${n}px"></div><figcaption>${n}${n <= 48 && c.simplify ? ' · simple' : ''}</figcaption></figure>`).join('')}</div>
      </div></div>`,
    slots: [
      { sel: '.slotHome', px: 60 },
      { sel: '.slotFav', px: 16, state: sm },
      { sel: '.slotBrand', px: 34, state: c.simplify ? 'mark-s' : 'mark' },
      { sel: '.slotHero', px: 124, state: 'mark' },
      { sel: '.sz180', px: 180 }, { sel: '.sz96', px: 96 }, { sel: '.sz64', px: 64 },
      { sel: '.sz48', px: 48, state: sm }, { sel: '.sz32', px: 32, state: sm }, { sel: '.sz16', px: 16, state: sm },
    ],
  };
}


function readout(c) {
  const k = geo(c).k, at32 = c.t * k * 32 / 512, at32s = c.t * 1.3 * k * 32 / 512, K = colors(c);
  const ks = K.spines.map(s => contrast(s, K.back)), kmin = Math.min(...ks), kavg = ks.reduce((a, b) => a + b, 0) / ks.length;
  const kp = contrast(K.wood, '#F3EAD7'), kg = contrast(K.outline, '#2F4A3A');
  const warn = (b, m) => b ? ` <span class="warn">${m}</span>` : '';
  return `Spines on the inside <b>${kavg.toFixed(1)}:1</b> average, <b>${kmin.toFixed(1)}:1</b> weakest${warn(kmin < 2.5, '· some spines blend into the inside')}` +
    ` · frame on parchment <b>${kp.toFixed(1)}:1</b>, outline on green <b>${kg.toFixed(1)}:1</b>${warn(kp < 2.5, '· frame faint on parchment')}` +
    `<br>Mark radius <b>${c.fit}</b> of 50${warn(c.fit > 40, '· outside the Android safe circle (40): launchers will crop it')}` +
    ` · frame at 32 px <b>${at32.toFixed(1)} px</b>${c.simplify ? ` (simple ${at32s.toFixed(1)} px)` : ''}${warn((c.simplify ? at32s : at32) < 1, '· thinner than a pixel')}`;
}

function surprise(c) {
  const tk = () => pick(['none', ...TRINKET_KINDS, ...TRINKET_KINDS]);
  return { shoulder: pick(['round', 'sleeve', 'taper']), armLen: Math.round(rand(240, 330)), armH: Math.round(rand(48, 74)),
    bicepH: Math.round(rand(70, 135)), bicepPeak: rand(0.45, 0.75), bicepFull: rand(0.45, 0.78), bicepStart: rand(0.02, 0.2), elbowR: Math.round(rand(14, 46)),
    foreH: Math.round(rand(110, 175)), foreW0: Math.round(rand(64, 96)), foreW1: Math.round(rand(46, 70)), foreLean: Math.round(rand(0, 30)), foreBulge: Math.round(rand(0, 24)),
    fist: pick(['mitten', 'fingers', 'knob', 'mitten']), fistW: Math.round(rand(76, 112)), fistH: Math.round(rand(52, 84)), fistTilt: Math.round(rand(-16, 6)),
    knuckle: rand(0.2, 0.9), thumbLen: rand(0.35, 0.85), scheme: pick(Object.keys(SCHEMES)), bookSize: rand(1, 2.2), density: rand(0.35, 0.8),
    seed: Math.round(rand(1, 99)), cubbyItem: pick(TRINKET_KINDS), tr1: tk(), tr2: tk(), tr3: tk() };
}

// ═════════════════════════════════════════════════════════════════════════════
// ENGINE: usually no edits below. Controls, presets, pins, send, persistence, loop.
// ═════════════════════════════════════════════════════════════════════════════

const store = {
  get(k, d) { try { const v = localStorage.getItem(LAB.key + ':' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(LAB.key + ':' + k, JSON.stringify(v)); } catch {} },
};
// #preset=Name opens that preset fresh (for headless checks; the companion server only serves "/", so no query string).
const hashPreset = decodeURIComponent((location.hash.match(/preset=([^&]+)/) || [])[1] || '');
let presetName = PRESETS[hashPreset] ? hashPreset : store.get('preset', Object.keys(PRESETS)[0]);
let cfg = Object.assign({}, BASE, PRESETS[presetName] || {}, PRESETS[hashPreset] ? {} : store.get('cfg', {}));
let pins = store.get('pins', []);
let curState = store.get('state', STATES[0][0]);
let dirty = true;

function f(n) { return (Math.round(n * 100) / 100).toString(); }
function poly(pts) { return 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z'; }
function squircle(r, n) { const pts = []; for (let i = 0; i < 96; i++) { const th = i / 96 * 2 * Math.PI, c = Math.cos(th), s = Math.sin(th); pts.push([r * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), r * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]); } return poly(pts); }
function rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function hex(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); }
function shade(a, amt) { return amt < 0 ? mix(a, '#000000', -amt) : mix(a, '#ffffff', amt); }
function lum(h) { const c = rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function contrast(a, b) { const A = lum(a), B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function svgWrap(px, inner) { return `<svg width="${f(px)}" height="${f(px)}" viewBox="-50 -50 100 100" style="display:block;overflow:visible">${inner}</svg>`; }

// Animated instances: re-drawn each frame. Static parts are rebuilt only when something changed.
const instances = [];
let uidN = 0;
function addInstance(el, px, getCfg, getState) { instances.push({ el, px, getCfg, getState, uid: 'u' + (uidN++) }); }
function dropInstances(group) { for (let i = instances.length - 1; i >= 0; i--) if (instances[i].group === group) instances.splice(i, 1); }

function rebuildContext() {
  dropInstances('ctx');
  const box = document.getElementById('context');
  const sc = contextScene(cfg, curState);
  box.innerHTML = sc.html;
  for (const s of sc.slots) box.querySelectorAll(s.sel).forEach(el => { addInstance(el, s.px, () => cfg, () => s.state || curState); instances[instances.length - 1].group = 'ctx'; });
  document.getElementById('readout').innerHTML = readout(cfg);
}
function rebuildGrid() {
  dropInstances('grid');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const [id, label, cap] of STATES) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="stage"><div></div></div><div class="cap">${label}<small>${cap}</small></div>`;
    grid.appendChild(card);
    addInstance(card.querySelector('.stage > div'), 104, () => cfg, () => id);
    instances[instances.length - 1].group = 'grid';
  }
}
function rebuildPins() {
  dropInstances('pin');
  const box = document.getElementById('pins');
  box.innerHTML = '';
  document.getElementById('pinBtn').textContent = pins.length ? `Pin this variant (${pins.length} pinned)` : 'Pin this variant';
  if (!pins.length) { box.innerHTML = '<div class="empty">Nothing pinned yet. Pin variants to compare them side by side.</div>'; return; }
  pins.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'pin';
    row.innerHTML = `<div class="name">${escapeHtml(p.name)}<small>${escapeHtml(p.preset || '')}</small></div>
      <div class="strip">${PIN_STATES.map(st => `<div data-st="${st}" title="${st}"></div>`).join('')}</div>
      <div class="row-buttons"><button data-load="${i}">Load</button><button data-del="${i}">Remove</button></div>`;
    box.appendChild(row);
    // Fill in defaults: a pin saved before a setting existed still draws.
    const pc = Object.assign({}, BASE, p.cfg);
    row.querySelectorAll('[data-st]').forEach(el => { addInstance(el, 40, () => pc, () => el.dataset.st); instances[instances.length - 1].group = 'pin'; });
  });
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / 30) return;
  last = now;
  if (dirty) { dirty = false; rebuildContext(); rebuildGrid(); rebuildPins(); store.set('cfg', cfg); }
  const t = now / 1000;
  // static subject: only touch the DOM when an instance's drawing changed
  for (const b of instances) { const h = svgWrap(b.px, draw(b.getCfg(), b.getState(), t, b.uid)); if (b.last !== h) { b.el.innerHTML = h; b.last = h; } }
}

function buildControls() {
  const root = document.getElementById('controls');
  root.innerHTML = '';
  let sec = null;
  for (const item of SCHEMA) {
    if (Array.isArray(item)) { sec = document.createElement('div'); sec.className = 'sec'; sec.innerHTML = `<div class="sec-title">${item[0]}</div>`; root.appendChild(sec); continue; }
    const row = document.createElement('div');
    row.className = 'ctl' + (item.t === 'check' ? ' check' : '');
    row.dataset.k = item.k;
    const id = 'c_' + item.k;
    if (item.t === 'range') {
      row.innerHTML = `<label for="${id}">${item.l}</label><input id="${id}" type="range" min="${item.min}" max="${item.max}" step="${item.step}"><span class="val"></span>`;
      const inp = row.querySelector('input'), val = row.querySelector('.val');
      inp.value = cfg[item.k]; val.textContent = fmt(cfg[item.k], item);
      inp.addEventListener('input', () => { cfg[item.k] = parseFloat(inp.value); val.textContent = fmt(cfg[item.k], item); changed(); });
    } else if (item.t === 'select') {
      row.innerHTML = `<label for="${id}">${item.l}</label><select id="${id}">${item.o.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
      const sel = row.querySelector('select'); sel.value = String(cfg[item.k]);
      sel.addEventListener('change', () => { cfg[item.k] = sel.value; changed(); });
    } else if (item.t === 'check') {
      row.innerHTML = `<label for="${id}">${item.l}</label><input id="${id}" type="checkbox">`;
      const cb = row.querySelector('input'); cb.checked = !!cfg[item.k];
      cb.addEventListener('change', () => { cfg[item.k] = cb.checked; changed(); });
    } else if (item.t === 'text') {
      row.innerHTML = `<label for="${id}">${item.l}</label><input id="${id}" type="text">`;
      const tx = row.querySelector('input'); tx.value = cfg[item.k] || '';
      tx.addEventListener('input', () => { cfg[item.k] = tx.value; changed(); });
    } else if (item.t === 'color') {
      row.innerHTML = `<label for="${id}">${item.l}</label><div class="colorwrap"><input id="${id}" type="color"><span class="hex"></span></div>` +
        (item.swatches ? `<span></span><div class="swatches">${SWATCHES.map(s => `<span style="background:${s}" data-sw="${s}" title="${s}"></span>`).join('')}</div>` : '');
      const inp = row.querySelector('input[type=color]'), hx = row.querySelector('.hex');
      const show = () => { inp.value = cfg[item.k]; hx.textContent = cfg[item.k].toUpperCase(); };
      show();
      inp.addEventListener('input', () => { cfg[item.k] = inp.value; show(); changed(); });
      row.querySelectorAll('[data-sw]').forEach(sw => sw.addEventListener('click', () => { cfg[item.k] = sw.dataset.sw; show(); changed(); }));
    }
    sec.appendChild(row);
  }
  refreshVisibility();
}
function fmt(v, item) { const n = item.step < 0.1 ? v.toFixed(2) : (item.step < 1 ? v.toFixed(1) : String(Math.round(v))); return n + (item.u || ''); }
function refreshVisibility() {
  for (const item of SCHEMA) {
    if (Array.isArray(item) || !item.when) continue;
    const row = document.querySelector(`.ctl[data-k="${item.k}"]`);
    if (row) row.classList.toggle('hidden', !item.when(cfg));
  }
}
function changed() { dirty = true; refreshVisibility(); }

function buildPresets() {
  const box = document.getElementById('presets');
  box.innerHTML = '';
  for (const name of Object.keys(PRESETS)) {
    const b = document.createElement('button');
    b.textContent = name;
    if (name === presetName) b.classList.add('primary');
    b.addEventListener('click', () => { presetName = name; store.set('preset', name); cfg = Object.assign({}, BASE, PRESETS[name]); buildPresets(); buildControls(); changed(); });
    box.appendChild(b);
  }
}
function buildStateSeg() {
  const seg = document.getElementById('stateSeg');
  seg.innerHTML = '';
  for (const [id, label] of STATES) {
    const b = document.createElement('button');
    b.textContent = label;
    if (id === curState) b.classList.add('on');
    b.addEventListener('click', () => { curState = id; store.set('state', id); buildStateSeg(); changed(); });
    seg.appendChild(b);
  }
}

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
// The companion injects window.brainstorm. A sent object lands only in $SCREEN_DIR/.server.log, as a
// line with "source":"user-event" (the server writes .events only for click events with a `choice`).
// The server stops after 30 idle minutes and any request counts as activity, so the page pings it
// while the tab is visible, which also tells us honestly whether Send can reach Claude.
let online = false;
async function heartbeat() {
  const conn = document.getElementById('conn');
  if (location.protocol === 'file:') { online = false; conn.textContent = 'Opened as a file: Send will not reach Claude'; return; }
  try { await fetch('/heartbeat', { cache: 'no-store' }); online = true; }
  catch { online = false; }
  conn.textContent = online ? (window.brainstorm ? 'Connected to Claude' : 'No companion helper on this page: use Copy JSON')
                            : 'Server stopped: Send will not reach Claude. Ask Claude to restart it; your pins are safe in this browser.';
  conn.classList.toggle('warn', !online);
}
heartbeat();
addEventListener('load', heartbeat); // the companion's helper script loads after this one
setInterval(() => { if (!document.hidden) heartbeat(); }, 4 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) heartbeat(); });
async function send(payload) {
  await heartbeat();
  if (online && window.brainstorm && window.brainstorm.send) { window.brainstorm.send(payload); return true; }
  return false;
}
// Numbers rounded to 2 decimals, so the JSON reads cleanly.
function clean(o) { return JSON.parse(JSON.stringify(o, (k, v) => typeof v === 'number' ? Math.round(v * 100) / 100 : v)); }
// The preset the config started from, and which settings differ from it now (after edits or Surprise me).
function presetInfo() {
  const ref = Object.assign({}, BASE, PRESETS[presetName] || {});
  const edited = Object.keys(ref).filter(k => JSON.stringify(clean({ v: ref[k] }).v) !== JSON.stringify(clean({ v: cfg[k] }).v));
  return { startedFrom: presetName, edited };
}
function payload(action) { return clean({ type: 'lab', lab: LAB.key, action, ...presetInfo(), state: curState, note: document.getElementById('note').value, cfg, pins }); }

document.getElementById('pinBtn').addEventListener('click', () => {
  // no prompt(): VS Code's browser and other embedded views block it, which silently dropped pins
  const name = `Variant ${pins.length + 1}`;
  const info = presetInfo();
  pins.push({ name, preset: info.startedFrom, cfg: clean(cfg) });
  store.set('pins', pins); changed();
  send(clean({ type: 'lab', lab: LAB.key, action: 'pin', name, ...info, cfg }));
  toast(`Pinned as ${name}: see Pinned variants below`);
});
document.getElementById('pins').addEventListener('click', e => {
  const l = e.target.dataset.load, d = e.target.dataset.del;
  if (l !== undefined) { cfg = Object.assign({}, BASE, JSON.parse(JSON.stringify(pins[+l].cfg))); buildControls(); changed(); toast('Loaded ' + pins[+l].name); }
  if (d !== undefined) { pins.splice(+d, 1); store.set('pins', pins); changed(); }
});
document.getElementById('sendBtn').addEventListener('click', async () => toast(await send(payload('send')) ? 'Sent. Tell Claude in the terminal.' : 'Not sent: the server is down. Use Copy JSON, or ask Claude to restart it.'));
document.getElementById('copyBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText(JSON.stringify(payload('copy'), null, 2)); toast('Copied'); } catch { toast('Copy failed'); } });
document.getElementById('surprise').addEventListener('click', () => { cfg = Object.assign({}, cfg, surprise(cfg)); buildControls(); changed(); });
document.getElementById('reset').addEventListener('click', () => { cfg = Object.assign({}, BASE, PRESETS[presetName]); buildControls(); changed(); });

document.title = LAB.title;
document.getElementById('labTitle').textContent = LAB.title;
document.getElementById('mainTitle').textContent = LAB.subject;
document.getElementById('blurb').textContent = LAB.blurb;
buildPresets(); buildControls(); buildStateSeg();
requestAnimationFrame(frame);
})();
</script>
</body>
