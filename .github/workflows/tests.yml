name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_JOBS: 2
      # GitHub's Ubuntu 24.04 runners block Chrome's user-namespace sandbox.
      CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fonts (debug, before)
        run: fc-match system-ui; fc-match sans-serif; fc-match Georgia; fc-match "Segoe UI"
      - name: Fonts like a phone's
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>' \
            '<alias binding="same"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>' \
            '<alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>' \
            '</fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-match system-ui; fc-match sans-serif
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Run shard ${{ matrix.shard }} of 6
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/browser/run.mjs --shard=${{ matrix.shard }}/6
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-out-shard-${{ matrix.shard }}
          path: tests/browser/out/
          if-no-files-found: ignore
